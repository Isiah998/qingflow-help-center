server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Keep directory redirects relative so the ingress-facing HTTPS scheme is preserved.
    absolute_redirect off;
    port_in_redirect off;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/markdown
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 静态资源长缓存（Docusaurus 构建产物带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片等媒体资源
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Crawler entry points must never fall back to the homepage.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location ^~ /raw-docs/ {
        default_type text/markdown;
        try_files $uri =404;
    }

    # Keep the browser on the help-center origin while Nginx reaches Typesense
    # through Kubernetes' internal DNS. Only the endpoint used by the static
    # search client is exposed.
    location = /typesense/multi_search {
        limit_except POST {
            deny all;
        }

        proxy_pass http://typesense-0.typesense-headless.outline.svc.cluster.local:8108/multi_search;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-TYPESENSE-API-KEY $http_x_typesense_api_key;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location ^~ /typesense/ {
        return 404;
    }

    # Docusaurus emits one index.html per route. Unknown routes must remain real 404s.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # 健康检查端点
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
